<!DOCTYPE html>

  <!-- Navigation -->
  <nav class="nav">

            <p class="hero-title fade-in fade-in-delay-2" id="hero-title"></p>

            <div class="hero-interests fade-in fade-in-delay-3" id="hero-interests"></div>
          </div>

        </div>
        <div class="stat-item fade-in fade-in-delay-2">
          <div class="stat-number" id="stat-hindex">—</div>
          <div class="stat-label">H-index</div>

        <div class="stat-item fade-in fade-in-delay-3">
          <div class="stat-number" id="stat-since">—</div>
          <div class="stat-label">Since</div>
        </div>
      </div>

                  </svg>

                <div>
